[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uslegalqa"
version = "3.0.0"
description = "Span-grounded question answering over US Supreme Court opinions"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
generate = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
